# Curated entries for the header release/version dropdown menu.
# File order = menu order. Branches NOT listed here still deploy and stay
# reachable via their /version/<branch>/ URL - they are just hidden from the menu.
#
#   id:    branch name of the release; its site is served at <basePath>/version/<id>/
#   label: menu text (optional, defaults to id)
#   url:   full link override for entries without a generated site page (optional)
#   note:  tooltip text shown on hover (optional)
#
# The entry with id "latest" links to the site root (main branch).
#
# This fork hosts only main. The released versions of the upstream specification
# (GfSE/SAF-Specification) remain available on the official site (saf.gfse.org).
- id: latest
  label: main
